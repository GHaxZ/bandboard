# docker compose -f docker-compose.yml -f docker-compose.https.yml up -d --build
# Requires Docker Compose >= 2.24.4 for !reset.
services:
  bandboard:
    ports: !reset []
    environment:
      PORT: 3000
      APP_ORIGIN: https://${DOMAIN:?Set DOMAIN to your public hostname}
      TRUST_PROXY: "true"
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN to your public hostname}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - bandboard
volumes:
  caddy_data:
  caddy_config:
